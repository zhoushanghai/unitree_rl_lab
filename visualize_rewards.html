<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RL Training Rewards Dashboard</title>
    <meta name="description" content="An interactive offline visualizer for reinforcement learning reward components. Analyzes TensorBoard event logs and renders beautiful charts.">
    <!-- Modern Typography & Plotly -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-2.24.1.min.js"></script>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151b2c;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent-color: #6366f1;
            --accent-hover: #4f46e5;
            --accent-glow: rgba(99, 102, 241, 0.15);
            --border-color: #222b44;
            --shadow-sm: 0 2px 8px rgba(0, 0, 0, 0.3);
            --shadow-md: 0 10px 30px -5px rgba(0, 0, 0, 0.5);
            --radius-lg: 16px;
            --radius-md: 12px;
            --radius-sm: 8px;
        }

        body {
            font-family: 'Plus Jakarta Sans', 'Outfit', sans-serif;
            margin: 0;
            padding: 24px;
            background-color: var(--bg-color);
            color: var(--text-main);
            line-height: 1.6;
            background-image: 
                radial-gradient(at 0% 0%, rgba(99, 102, 241, 0.05) 0px, transparent 50%),
                radial-gradient(at 100% 100%, rgba(147, 51, 234, 0.05) 0px, transparent 50%);
            background-attachment: fixed;
        }

        .container {
            max-width: 1500px;
            margin: 0 auto;
            display: flex;
            flex-direction: column;
            gap: 24px;
            animation: fadeIn 0.6s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Header Card with Glassmorphism */
        header.header-card {
            background: rgba(21, 27, 44, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius-lg);
            padding: 24px 32px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .title-area h1 {
            margin: 0;
            font-size: 2em;
            font-weight: 800;
            font-family: 'Outfit', sans-serif;
            background: linear-gradient(135deg, #818cf8, #c084fc);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: -0.5px;
        }

        .title-area p {
            margin: 6px 0 0 0;
            color: var(--text-muted);
            font-size: 0.95em;
        }

        .controls {
            display: flex;
            align-items: center;
            gap: 16px;
        }

        /* Modern styled dropdown selector */
        #run-selector {
            padding: 12px 20px;
            font-size: 0.95em;
            font-family: inherit;
            font-weight: 600;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-main);
            cursor: pointer;
            outline: none;
            min-width: 380px;
            max-width: 500px;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: var(--shadow-sm);
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%2394a3b8' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'%3e%3cpolyline points='6 9 12 15 18 9'%3e%3c/polyline%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 16px center;
            background-size: 16px;
            padding-right: 48px;
        }

        #run-selector:hover {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        #run-selector:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 4px var(--accent-glow);
        }

        /* Main layout split */
        main.main-layout {
            display: grid;
            grid-template-columns: 350px 1fr;
            gap: 24px;
        }

        @media (max-width: 1024px) {
            main.main-layout {
                grid-template-columns: 1fr;
            }
        }

        /* Sidebar Glass Card */
        aside.sidebar {
            background: rgba(21, 27, 44, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            gap: 20px;
            max-height: 75vh;
            position: sticky;
            top: 24px;
        }

        .sidebar-title {
            font-weight: 700;
            font-size: 1.1em;
            letter-spacing: 0.5px;
            margin: 0;
            color: #f8fafc;
            border-left: 4px solid var(--accent-color);
            padding-left: 10px;
        }

        /* Search input styling */
        .search-box input {
            width: 100%;
            padding: 10px 16px;
            box-sizing: border-box;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background-color: rgba(11, 15, 25, 0.6);
            color: var(--text-main);
            font-family: inherit;
            font-size: 0.9em;
            outline: none;
            transition: all 0.2s ease;
        }

        .search-box input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px var(--accent-glow);
        }

        .quick-actions {
            display: flex;
            gap: 8px;
        }

        /* High-quality button styles */
        .btn {
            flex: 1;
            padding: 8px 12px;
            font-size: 0.85em;
            font-family: inherit;
            font-weight: 600;
            border-radius: var(--radius-sm);
            border: 1px solid var(--border-color);
            background-color: var(--card-bg);
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            text-align: center;
        }

        .btn:hover {
            border-color: var(--accent-color);
            color: #ffffff;
            background-color: var(--accent-color);
            box-shadow: 0 4px 12px rgba(99, 102, 241, 0.2);
        }

        .btn:active {
            transform: scale(0.97);
        }

        /* Scrollable list */
        .trace-list {
            display: flex;
            flex-direction: column;
            gap: 6px;
            overflow-y: auto;
            flex-grow: 1;
            padding-right: 4px;
        }

        /* Custom Scrollbar for sleek UI */
        .trace-list::-webkit-scrollbar {
            width: 6px;
        }
        .trace-list::-webkit-scrollbar-track {
            background: transparent;
        }
        .trace-list::-webkit-scrollbar-thumb {
            background: #222b44;
            border-radius: 3px;
        }
        .trace-list::-webkit-scrollbar-thumb:hover {
            background: #4f46e5;
        }

        /* Checklist items with custom style */
        .trace-item {
            display: flex;
            align-items: center;
            gap: 12px;
            font-size: 0.9em;
            padding: 8px 12px;
            border-radius: var(--radius-sm);
            cursor: pointer;
            transition: all 0.15s ease;
            user-select: none;
            background: rgba(255, 255, 255, 0.02);
            border: 1px solid transparent;
        }

        .trace-item:hover {
            background-color: rgba(255, 255, 255, 0.05);
            border-color: rgba(99, 102, 241, 0.2);
        }

        .trace-item input[type="checkbox"] {
            width: 16px;
            height: 16px;
            border-radius: 4px;
            accent-color: var(--accent-color);
            cursor: pointer;
            margin: 0;
        }

        .color-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            flex-shrink: 0;
            box-shadow: 0 0 6px currentColor;
        }

        .trace-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            color: var(--text-main);
        }

        /* Chart container styling */
        section.chart-card {
            background: rgba(21, 27, 44, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border-radius: var(--radius-lg);
            padding: 24px;
            box-shadow: var(--shadow-md);
            border: 1px solid var(--border-color);
            min-height: 600px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            position: relative;
        }

        #chart {
            width: 100%;
            height: 70vh;
            min-height: 550px;
        }

        /* Empty state design */
        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 100px 20px;
            animation: fadeIn 0.4s ease-out;
        }

        .empty-state svg {
            width: 80px;
            height: 80px;
            margin-bottom: 24px;
            stroke: var(--accent-color);
            fill: none;
            stroke-width: 1.5;
            opacity: 0.8;
            display: inline-block;
            filter: drop-shadow(0 0 8px rgba(99, 102, 241, 0.4));
        }

        .empty-state h3 {
            font-size: 1.4em;
            margin: 0 0 10px 0;
            color: #f8fafc;
            font-family: 'Outfit', sans-serif;
        }

        .empty-state p {
            max-width: 450px;
            margin: 0 auto;
            font-size: 0.95em;
        }

        /* Loading spinner */
        .spinner {
            display: inline-block;
            width: 40px;
            height: 40px;
            border: 3px solid rgba(99, 102, 241, 0.2);
            border-radius: 50%;
            border-top-color: var(--accent-color);
            animation: spin 1s ease-in-out infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header Section -->
        <header class="header-card">
            <div class="title-area">
                <h1>RL Training Rewards Dashboard</h1>
                <p>Interactive visualizer for reinforcement learning reward components (Local Offline Mode)</p>
            </div>
            <div class="controls">
                <select id="run-selector" title="选择要可视化的训练实验目录">
                    <option value="">-- Choose a Training Run --</option>
                </select>
            </div>
        </header>

        <!-- Main Content Area -->
        <main class="main-layout">
            <!-- Sidebar with Filters -->
            <aside class="sidebar">
                <h2 class="sidebar-title">Reward Components</h2>
                <div class="search-box">
                    <input type="text" id="trace-search" placeholder="Search components..." title="输入以过滤奖励项名称">
                </div>
                <div class="quick-actions">
                    <button class="btn" id="btn-select-all" title="勾选所有奖励项">All</button>
                    <button class="btn" id="btn-deselect-all" title="取消勾选所有奖励项">None</button>
                    <button class="btn" id="btn-toggle-important" title="仅勾选主要奖励项">Main</button>
                </div>
                <div class="trace-list" id="trace-container">
                    <!-- Dynamic checklist items -->
                </div>
            </aside>

            <!-- Chart Visualization -->
            <section class="chart-card">
                <div id="chart">
                    <div class="empty-state" id="empty-state">
                        <svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                            <line x1="18" y1="20" x2="18" y2="10"></line>
                            <line x1="12" y1="20" x2="12" y2="4"></line>
                            <line x1="6" y1="20" x2="6" y2="14"></line>
                        </svg>
                        <h3>No Run Selected</h3>
                        <p>Please select a training run from the dropdown list above to visualize and compare its reward components.</p>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <!-- Master runs list index -->
    <script src="logs/runs_list.js"></script>
    <script>
        // DOM Elements
        const selector = document.getElementById('run-selector');
        const traceContainer = document.getElementById('trace-container');
        const traceSearch = document.getElementById('trace-search');
        const emptyState = document.getElementById('empty-state');
        
        let loadedData = null;
        let activeTraces = {}; // tag -> boolean
        
        // High-contrast vibrant colors designed to pop on the dark background
        const colors = [
            '#6366f1', '#3b82f6', '#10b981', '#f59e0b', '#ec4899', 
            '#8b5cf6', '#06b6d4', '#14b8a6', '#f43f5e', '#a855f7',
            '#059669', '#d97706', '#2563eb', '#db2777', '#7c3aed',
            '#0891b2', '#0f766e', '#e11d48', '#b45309', '#1d4ed8'
        ];

        // 1. Populate run dropdown from window.runsList
        if (window.runsList && Array.isArray(window.runsList)) {
            window.runsList.forEach(run => {
                const opt = document.createElement('option');
                opt.value = run.path;
                opt.textContent = run.name;
                selector.appendChild(opt);
            });
        }

        // 2. Handle dropdown select change event
        selector.addEventListener('change', function() {
            const runPath = this.value;
            if (!runPath) {
                clearChart();
                return;
            }

            // Clean up previous dynamic script node if exists
            const oldScript = document.getElementById('dynamic-data-script');
            if (oldScript) oldScript.remove();

            // Set loading state UI
            emptyState.style.display = 'block';
            emptyState.innerHTML = `
                <div class="spinner"></div>
                <h3>Loading Rewards Data</h3>
                <p>Parsing database arrays for run "${runPath.split('/').pop()}"...</p>
            `;

            // Dynamically load the selected run's javascript compiled output
            const script = document.createElement('script');
            script.id = 'dynamic-data-script';
            script.src = runPath + '/rewards_data.js';
            script.onload = function() {
                if (window.currentRunData) {
                    loadedData = window.currentRunData;
                    emptyState.style.display = 'none';
                    initTracesState();
                    buildSidebar();
                    renderChart();
                } else {
                    showErrorState("No data declared inside rewards_data.js");
                }
            };
            script.onerror = function() {
                showErrorState(`Failed to find ${runPath}/rewards_data.js.<br>Please ensure update_visualizer_data.py has successfully processed this log.`);
            };
            document.body.appendChild(script);
        });

        function clearChart() {
            loadedData = null;
            traceContainer.innerHTML = '';
            Plotly.purge('chart');
            emptyState.style.display = 'block';
            emptyState.innerHTML = `
                <svg viewBox="0 0 24 24" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="20" x2="18" y2="10"></line>
                    <line x1="12" y1="20" x2="12" y2="4"></line>
                    <line x1="6" y1="20" x2="6" y2="14"></line>
                </svg>
                <h3>No Run Selected</h3>
                <p>Please select a training run from the dropdown list above to visualize and compare its reward components.</p>
            `;
        }

        function showErrorState(msg) {
            emptyState.style.display = 'block';
            emptyState.innerHTML = `
                <svg viewBox="0 0 24 24" stroke="#f43f5e" stroke-linecap="round" stroke-linejoin="round" style="stroke:#f43f5e">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <h3 style="color:#f43f5e">Error Loading Data</h3>
                <p>${msg}</p>
            `;
            traceContainer.innerHTML = '';
            Plotly.purge('chart');
        }

        // 3. Initialize trace display states
        function initTracesState() {
            activeTraces = {};
            const keys = Object.keys(loadedData);
            
            // Auto-enable primary/critical reward components if too many exist
            const importantKeywords = ['total', 'track_lin', 'track_ang', 'alive', 'action'];
            keys.forEach(key => {
                const keyLower = key.toLowerCase();
                const isImportant = importantKeywords.some(kw => keyLower.includes(kw));
                activeTraces[key] = (keys.length <= 10) || isImportant;
            });
        }

        // 4. Populate sidebar checkboxes dynamically
        function buildSidebar() {
            traceContainer.innerHTML = '';
            if (!loadedData) return;

            const searchQuery = traceSearch.value.toLowerCase();
            let idx = 0;

            Object.keys(loadedData).forEach(tag => {
                const displayName = tag.replace('Episode_Reward/', '');
                // Filter out non-matching names if search query is active
                if (searchQuery && !displayName.toLowerCase().includes(searchQuery)) {
                    idx++;
                    return; 
                }

                const item = document.createElement('div');
                item.className = 'trace-item';
                
                const color = colors[idx % colors.length];

                item.innerHTML = `
                    <input type="checkbox" id="chk-${idx}" ${activeTraces[tag] ? 'checked' : ''} data-tag="${tag}" title="Toggle ${displayName}">
                    <span class="color-dot" style="background-color: ${color}; color: ${color}"></span>
                    <span class="trace-name" title="${displayName}">${displayName}</span>
                `;

                // Handle item body click to toggle checkbox
                const toggle = () => {
                    const checkbox = item.querySelector('input');
                    checkbox.checked = !checkbox.checked;
                    activeTraces[tag] = checkbox.checked;
                    renderChart();
                };

                item.querySelector('input').addEventListener('click', (e) => {
                    e.stopPropagation(); // Avoid double toggling
                    activeTraces[tag] = e.target.checked;
                    renderChart();
                });

                item.addEventListener('click', toggle);
                traceContainer.appendChild(item);
                idx++;
            });
        }

        // 5. Render/Update the Plotly chart with dark theme settings
        function renderChart() {
            if (!loadedData) return;

            const traces = [];
            let idx = 0;

            Object.entries(loadedData).forEach(([tag, content]) => {
                if (activeTraces[tag]) {
                    traces.push({
                        x: content.steps,
                        y: content.values,
                        mode: 'lines',
                        name: tag.replace('Episode_Reward/', ''),
                        line: { width: 2.2, color: colors[idx % colors.length] },
                        hoverinfo: 'name+x+y',
                        type: 'scatter'
                    });
                }
                idx++;
            });

            // Layout configurations optimized for Dark Mode visual comfort
            const layout = {
                xaxis: {
                    title: { text: 'Iteration / Steps', font: { color: '#94a3b8', size: 13 } },
                    gridcolor: '#222b44',
                    zerolinecolor: '#222b44',
                    tickfont: { color: '#94a3b8' }
                },
                yaxis: {
                    title: { text: 'Reward Value', font: { color: '#94a3b8', size: 13 } },
                    gridcolor: '#222b44',
                    zerolinecolor: '#222b44',
                    tickfont: { color: '#94a3b8' }
                },
                hovermode: 'x unified',
                hoverlabel: {
                    bgcolor: '#1e293b',
                    bordercolor: '#475569',
                    font: { color: '#f8fafc', family: 'Plus Jakarta Sans' }
                },
                margin: { r: 30, t: 20, b: 60, l: 60 },
                legend: {
                    orientation: 'h',
                    y: -0.15,
                    x: 0.5,
                    xanchor: 'center',
                    font: { color: '#f8fafc', size: 11, family: 'Plus Jakarta Sans' },
                    bgcolor: 'rgba(21, 27, 44, 0.5)',
                    bordercolor: '#222b44',
                    borderwidth: 1
                },
                plot_bgcolor: '#151b2c',
                paper_bgcolor: 'rgba(0,0,0,0)'
            };

            Plotly.react('chart', traces, layout, {
                responsive: true,
                displaylogo: false,
                modeBarButtonsToRemove: ['select2d', 'lasso2d', 'autoScale2d', 'toggleSpikelines']
            });
        }

        // 6. Action button event bindings
        traceSearch.addEventListener('input', buildSidebar);

        document.getElementById('btn-select-all').addEventListener('click', () => {
            if (!loadedData) return;
            Object.keys(loadedData).forEach(tag => activeTraces[tag] = true);
            buildSidebar();
            renderChart();
        });

        document.getElementById('btn-deselect-all').addEventListener('click', () => {
            if (!loadedData) return;
            Object.keys(loadedData).forEach(tag => activeTraces[tag] = false);
            buildSidebar();
            renderChart();
        });

        document.getElementById('btn-toggle-important').addEventListener('click', () => {
            if (!loadedData) return;
            initTracesState();
            buildSidebar();
            renderChart();
        });
    </script>
</body>
</html>
